<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로또 추첨기</title>
    <style>
      .ball {
        display: inline-block;
        border: 1px solid black;
        border-radius: 20px;
        width: 40px;
        height: 40px;
        line-height: 40px;
        font-size: 20px;
        text-align: center;
        margin-left: 20px;
        color: white;
      }
    </style>
  </head>
  <body>
    <form id="form" action="">
      <input
        name="input"
        placeholder="숫자 6개를 쉼표로 구분해 입력하세요"
        type="text"
      />
      <button id="button">추첨</button>
    </form>
    <div id="result">당첨 숫자</div>
    <div id="bonus">보너스 숫자</div>

    <script>
      const $form = document.querySelector("#form");
      const $result = document.querySelector("#result");
      const $bonus = document.querySelector("#bonus");
      const $button = document.querySelector("#button");

      function drawBall(value, $target) {
        const $ball = document.createElement("div");
        $ball.className = "ball";
        $ball.textContent = value;
        if (value < 10) {
          $ball.style = "background-color: red;";
        } else if (value < 20) {
          $ball.style = "background-color: orange;";
        } else if (value < 30) {
          $ball.style = "background-color: #8B8000;";
        } else if (value < 40) {
          $ball.style = "background-color: blue;";
        } else {
          $ball.style = "background-color: green;";
        }
        $target.appendChild($ball);
      }

      function reset() {
        $result.textContent = "당첨 숫자";
        $bonus.textContent = "보너스 숫자";
      }

      const setTimeoutPromise = (ms) =>
        new Promise((resolve, reject) => {
          setTimeout(resolve, ms);
        });

      $form.addEventListener("submit", async (e) => {
        e.preventDefault();
        $button.setAttribute("disabled", true);
        reset();

        const string = e.target.input.value;
        if (!string.trim()) {
          return alert("숫자 입력");
        }

        const myNumbers = string
          .split(",")
          .map((numberString) => parseInt(numberString));
        if (myNumbers.length !== 6) {
          return alert("숫자 6개 입력");
        }
        if (new Set(myNumbers).size !== 6) {
          return alert("중복되지 않는 숫자 입력");
        }
        if (myNumbers.find((v) => v < 1 || v > 45)) {
          return alert("1부터 45까지만 입력");
        }
        console.log(myNumbers);

        const candidate = Array(45)
          .fill(1)
          .map((v, idx) => idx + 1);
        console.log(candidate);

        const shuffle = [];
        while (candidate.length) {
          const randomIdx = Math.floor(Math.random() * candidate.length);
          const spliceArr = candidate.splice(randomIdx, 1);
          shuffle.push(spliceArr[0]);
        }
        console.log(shuffle);

        const winBalls = shuffle.slice(0, 6).sort((a, b) => a < b);
        const bonusBall = shuffle[6];
        console.log(winBalls);

        for (let i = 0; i < 6; i++) {
          await setTimeoutPromise(1000);
          drawBall(winBalls[i], $result);
        }
        await setTimeoutPromise(1000);
        drawBall(bonusBall, $bonus);

        await setTimeoutPromise(0);
        let count = 0;
        myNumbers.forEach((el) => {
          if (winBalls.includes(el)) {
            count++;
          }
        });

        if (count === 6) {
          alert("1등! 현실 로또 당첨될 운을 여기에 쓰시다니...");
        } else if (count === 5) {
          if (myNumbers.includes(bonusBall)) {
            alert("2등! 보너스 공이지만 숫자 6개를 맞추셨네요.");
          } else {
            alert("3등! 아쉽습니다. 그래도 축하드려요.");
          }
        } else if (count === 4) {
          alert("4등! 5만 원 축하드려요.");
        } else if (count === 3) {
          alert("5등! 5천 원 축하드려요.");
        } else {
          alert("로또 참 어렵죠?");
        }

        $button.removeAttribute("disabled");
      });
    </script>
  </body>
</html>
